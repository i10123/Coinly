name: coinly
description: Локальный прототип домашнего бюджета Coinly.
publish_to: "none"
version: 0.1.1+2

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  file_picker: ^12.0.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^3.0.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/coinly_logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/coinly_logo.jpg
  min_sdk_android: 24
  remove_alpha_ios: true
